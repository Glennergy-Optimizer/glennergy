name: Doxygen AI

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or ref to check out for the run"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
      model:
        description: "OpenAI model to use for this run"
        required: false
        default: "gpt-5.4-mini"
      rerun_mode:
        description: "Use 'all' to process selected file_paths, or 'remaining_only' to rerun previously rejected/deferred files"
        required: false
        default: "all"
      test_label:
        description: "Optional label for comparing runs. Reuse the same label when rerunning 'remaining_only' for a labeled run"
        required: false
        default: ""
      file_paths:
        description: "Comma-separated file paths for 'all' mode. Leave empty in 'remaining_only' mode"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: doxygen-ai-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_label || 'default' }}
  cancel-in-progress: false

jobs:
  update-doxygen:
    if: >
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-doxygen]'))
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.model || 'gpt-5.4-mini' }}
      MAX_FILES_PER_RUN: "30"
      MAX_CHARS_PER_FILE: "30000"
      OPENAI_MAX_OUTPUT_TOKENS: "50000"
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      TARGET_REF: ${{ github.event.inputs.target_ref }}
      RERUN_MODE: ${{ github.event.inputs.rerun_mode }}
      TEST_LABEL: ${{ github.event.inputs.test_label }}
      MANUAL_FILE_PATHS: ${{ github.event.inputs.file_paths }}
      MANIFEST_PATH: tools/doxygen_ai/state/run_manifest.json
      BASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_ref || 'dev' }}
    steps:
      - name: Validate target ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${TARGET_REF}" in
            dev) ;;
            *)
              echo "Target ref is not approved: ${TARGET_REF}" >&2
              exit 1
              ;;
          esac

      - name: Derive PR metadata
        run: |
          if [ -n "${TEST_LABEL}" ]; then
            SAFE_LABEL=$(printf '%s' "${TEST_LABEL}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//' | sed 's/-$//')
            if [ -z "${SAFE_LABEL}" ]; then
              SAFE_LABEL="test-${GITHUB_RUN_ID}"
            fi
            echo "PR_BRANCH=docs/doxygen-ai-${SAFE_LABEL}" >> "$GITHUB_ENV"
            echo "PR_TITLE=[skip-doxygen] docs: AI Doxygen updates [${SAFE_LABEL}]" >> "$GITHUB_ENV"
            echo "PR_KEY=${SAFE_LABEL}" >> "$GITHUB_ENV"
          else
            echo "PR_BRANCH=docs/doxygen-ai" >> "$GITHUB_ENV"
            echo "PR_TITLE=[skip-doxygen] docs: AI Doxygen updates" >> "$GITHUB_ENV"
            echo "PR_KEY=default" >> "$GITHUB_ENV"
          fi

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download latest manifest for remaining-only rerun
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.rerun_mode == 'remaining_only'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          MANIFEST_ARTIFACT_NAME: doxygen-ai-manifest-${{ env.PR_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          import zipfile

          class StripAuthOnCrossHostRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  redirected = super().redirect_request(
                      request, file_pointer, code, message, headers, new_url
                  )
                  if redirected is not None:
                      old_host = urllib.parse.urlsplit(request.full_url).netloc.lower()
                      new_host = urllib.parse.urlsplit(new_url).netloc.lower()
                      if old_host != new_host:
                          redirected.remove_header("Authorization")
                  return redirected

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          artifact_name = os.environ["MANIFEST_ARTIFACT_NAME"]
          manifest_path = pathlib.Path(os.environ["MANIFEST_PATH"])
          api_url = f"https://api.github.com/repos/{repository}/actions/artifacts?per_page=100"

          request = urllib.request.Request(
              api_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              },
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))

          artifacts = [
              artifact for artifact in payload.get("artifacts", [])
              if artifact.get("name") == artifact_name and not artifact.get("expired", False)
          ]

          if not artifacts:
              raise SystemExit(f"No manifest artifact found for {artifact_name}")

          artifacts.sort(key=lambda item: item.get("created_at", ""), reverse=True)
          download_url = artifacts[0]["archive_download_url"]
          download_request = urllib.request.Request(
              download_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              },
          )

          zip_path = manifest_path.parent / "manifest_artifact.zip"
          manifest_path.parent.mkdir(parents=True, exist_ok=True)

          download_opener = urllib.request.build_opener(StripAuthOnCrossHostRedirect())
          with download_opener.open(download_request, timeout=60) as response:
              zip_path.write_bytes(response.read())

          destination = manifest_path.parent.resolve()
          with zipfile.ZipFile(zip_path, "r") as archive:
              for member in archive.infolist():
                  member_path = (destination / member.filename).resolve()
                  try:
                      member_path.relative_to(destination)
                  except ValueError as exc:
                      raise RuntimeError(f"Unsafe path in manifest artifact: {member.filename}") from exc
              archive.extractall(destination)

          zip_path.unlink(missing_ok=True)
          print(f"Downloaded manifest artifact to {manifest_path}")
          PY

      - name: Restore existing campaign changes from PR branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --heads origin "${PR_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${PR_BRANCH}"
            mapfile -t RESTORE_FILES < <(git diff --name-only "origin/${TARGET_REF}" "origin/${PR_BRANCH}" -- . ':(exclude).github/workflows/*' ':(exclude)tools/doxygen_ai/*')

            if [ "${#RESTORE_FILES[@]}" -gt 0 ]; then
              git checkout "origin/${PR_BRANCH}" -- "${RESTORE_FILES[@]}"
              echo "Restored ${#RESTORE_FILES[@]} file(s) from ${PR_BRANCH}"
            else
              echo "No prior documentation files to restore from ${PR_BRANCH}"
            fi
          else
            echo "No existing remote PR branch found for ${PR_BRANCH}; continuing without restore"
          fi

      - name: Update Doxygen comments for changed files
        id: update_docs
        run: |
          if [ "${RERUN_MODE}" = "remaining_only" ]; then
            python tools/doxygen_ai/update_docs.py --remaining-only --manifest "${MANIFEST_PATH}" --model "${OPENAI_MODEL}" --test-label "${TEST_LABEL}"
          else
            python tools/doxygen_ai/update_docs.py --files "${MANUAL_FILE_PATHS}" --manifest "${MANIFEST_PATH}" --model "${OPENAI_MODEL}" --test-label "${TEST_LABEL}"
          fi

      - name: Detect eligible documentation changes
        id: documentation_changes
        if: always() && steps.update_docs.outcome != 'skipped'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- '*.c' '*.h' '*.cpp' '*.hpp' '*.cc' '*.hh')" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Eligible C/C++ documentation changes are present"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No eligible C/C++ documentation changes are present"
          fi

      - name: Upload rejected outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doxygen-ai-rejected-outputs-${{ github.run_id }}
          path: tools/doxygen_ai/rejected
          if-no-files-found: ignore

      - name: Upload run manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doxygen-ai-manifest-${{ env.PR_KEY }}
          path: ${{ env.MANIFEST_PATH }}
          if-no-files-found: ignore

      - name: Create draft pull request with documentation updates
        if: always() && steps.documentation_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[skip-doxygen] docs: update doxygen comments"
          branch: ${{ env.PR_BRANCH }}
          delete-branch: false
          add-paths: |
            **/*.c
            **/*.h
            **/*.cpp
            **/*.hpp
            **/*.cc
            **/*.hh
          title: ${{ env.PR_TITLE }}
          body: |
            This draft PR contains automated Doxygen documentation updates generated for changed files.

            Requested model: `${{ env.OPENAI_MODEL }}`
            Test label: `${{ env.TEST_LABEL }}`
            Rerun mode: `${{ env.RERUN_MODE }}`
            Target ref: `${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_ref || github.ref_name }}`

            Please review carefully before merging:
            - confirm the documentation matches the project standard
            - confirm no code behavior was changed
            - edit wording if needed before merge
          draft: true
          base: ${{ env.BASE_REF }}
